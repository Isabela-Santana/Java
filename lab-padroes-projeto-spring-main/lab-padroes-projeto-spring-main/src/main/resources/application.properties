# Nome da Aplicação
spring.application.name=lab-padroes-projeto-spring

# Configurações do Banco de Dados H2 em Memória
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

spring.datasource.url=jdbc:mysql://localhost:3306/lab_padroes_spring
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o Console Web do H2 (Acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualização automática do schema do banco
spring.jpa.hibernate.ddl-auto=update